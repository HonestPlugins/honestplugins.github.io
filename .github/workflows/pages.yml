name: Publicar en GitHub Pages

# El pipeline antiguo (Jekyll) empezo a fallar con "Page build failed" sin
# mas detalle. Este sitio es HTML plano y no necesita Jekyll, asi que se
# publica con Actions: sube el repositorio tal cual como artefacto y lo
# despliega. Ventaja practica: si algo falla, el log dice QUE ha fallado.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya este en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
